name: Build HopeStudio RackStrip500 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3 & Standalone Release
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: Package VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackStrip500-Windows-VST3
          path: build/RackStrip500_artefacts/Release/VST3/RackStrip500.vst3

      - name: Package Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackStrip500-Windows-Standalone
          path: build/RackStrip500_artefacts/Release/Standalone/RackStrip500.exe
