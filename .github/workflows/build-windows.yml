name: Build Windows VST3 & Standalone

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackStrip500-Windows-VST3
          path: build/RackStrip500_artefacts/Release/VST3/RackStrip500.vst3
          if-no-files-found: error

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackStrip500-Windows-Standalone
          path: build/RackStrip500_artefacts/Release/Standalone/RackStrip500.exe
          if-no-files-found: error
